<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Airtable Live Sheet</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-title">
      <h1>Airtable Live Sheet</h1>
      <p class="subtitle">Edits here save to Airtable instantly. Changes made in Airtable show up here automatically.</p>
    </div>
    <div class="toolbar-right">
      <span id="status" class="status status-connecting"><span class="status-dot"></span>Connecting…</span>
      <button id="themeToggle" class="btn-secondary" title="Toggle dark mode">🌙 Dark</button>
      <div class="undo-wrap">
        <button id="undoBtn" class="btn-secondary" title="Restore recently deleted rows (Ctrl+Z)">↺ Undo delete</button>
        <div id="undoPanel" class="dropdown-panel hidden"></div>
      </div>
      <div class="undo-wrap">
        <button id="historyBtn" class="btn-secondary" title="View edit history">🕒 History</button>
        <div id="historyPanel" class="dropdown-panel hidden"></div>
      </div>
      <button id="addRowBtn" class="btn-primary">+ Add row</button>
      <button id="refreshBtn" class="btn-secondary" title="Refresh now">⟳ Refresh</button>
    </div>
  </header>

  <div id="undoToast" class="undo-toast hidden"></div>

  <div id="filtersBar" class="filters-bar">
    <div id="searchWrap" class="filter-field">
      <input type="text" id="searchInput" placeholder="Search by student name…" />
    </div>
    <div id="statusFilterWrap" class="filter-field hidden">
      <select id="statusFilter"><option value="">All statuses</option></select>
    </div>
    <div id="completionFilterWrap" class="filter-field hidden">
      <select id="completionFilter">
        <option value="">All completion</option>
        <option value="0-25">0–25%</option>
        <option value="26-50">26–50%</option>
        <option value="51-75">51–75%</option>
        <option value="76-100">76–100%</option>
      </select>
    </div>
    <div id="trendFilterWrap" class="filter-field hidden">
      <select id="trendFilter"><option value="">All trends</option></select>
    </div>
  </div>

  <div id="errorBanner" class="error-banner hidden"></div>

  <main>
    <div class="card">
      <div class="table-wrap">
        <table id="sheet">
          <thead><tr id="headerRow"></tr></thead>
          <tbody id="bodyRows"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state hidden">
        <p><strong>No columns to show yet.</strong></p>
        <p>Add a field to this table in Airtable, then hit Refresh.</p>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
